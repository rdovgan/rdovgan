name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-renders
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Built from source: the patch adds commits from private repositories, which GitHub hides from contributionsCollection,
      # and colors the sides of each bar by the day's main language
      - uses: actions/checkout@v5
        with:
          repository: yoshi389111/github-profile-3d-contrib
          ref: 7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
          path: .3d-contrib
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build 3D contrib
        working-directory: .3d-contrib
        run: |
          git apply ../.github/patches/3d-contrib.patch
          npm ci --no-audit --no-fund
          npx tsc
      - name: Generate 3D contrib
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-colors.json
          LANGUAGE_COLORS: "true"
          # How the language marks the bar top: glow, center or fill
          LANGUAGE_STYLE: glow
          TIME_ZONE: Europe/Kyiv
        run: node .3d-contrib/dist0/src/index.js
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "Update 3D contrib"; then
            git pull --rebase
            git push
          fi
