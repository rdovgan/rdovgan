name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-renders
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check token access
        env:
          TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          curl -sS -o /dev/null -D - -H "Authorization: bearer $TOKEN" https://api.github.com/user | grep -i '^x-oauth-scopes' || echo "No x-oauth-scopes header (not a classic token?)"
          curl -sS -H "Authorization: bearer $TOKEN" -X POST https://api.github.com/graphql \
            -d '{"query":"{ viewer { login contributionsCollection { restrictedContributionsCount commitContributionsByRepository(maxRepositories: 100) { repository { isPrivate } contributions { totalCount } } } } }"}' \
            | jq '{viewer: .data.viewer.login, restricted: .data.viewer.contributionsCollection.restrictedContributionsCount, commits_by_visibility: (.data.viewer.contributionsCollection.commitContributionsByRepository // [] | group_by(.repository.isPrivate) | map({private: .[0].repository.isPrivate, repos: length, commits: (map(.contributions.totalCount) | add)})), errors: .errors}'
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "Update 3D contrib"; then
            git pull --rebase
            git push
          fi
